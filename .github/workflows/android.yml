name: android

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
          distribution: 'temurin'
          java-version: '17'
    - name: Build AAB with Gradle
      # We build an AAB as well for uploading to the the Play Store.
      run: cd android; ./gradlew bundlerelease
    - name: Build APKs with Gradle
      # "assemblerelease" is very fast after "bundlerelease".
      run: cd android; ./gradlew assemblerelease
    - name: Sign APKs
      # The release APKs come out of Gradle unsigned, and Android refuses to
      # install an unsigned package ("package appears to be invalid"). We sign
      # every ABI with a self-signed key generated here so the artifacts can be
      # sideloaded directly. This is not a Play Store upload key (the AAB is
      # signed by Google Play); it just makes the standalone APKs installable.
      run: |
        set -eu
        KS="$RUNNER_TEMP/akititocraft.keystore"
        keytool -genkeypair -v -keystore "$KS" \
          -alias akititocraft -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass akititocraft -keypass akititocraft \
          -dname "CN=AkititoCraft, OU=Game, O=AkititoCraft, L=NA, ST=NA, C=NA"
        BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
        echo "Using build-tools: $BT"
        OUT=android/app/build/outputs/apk/release
        for abi in armeabi-v7a arm64-v8a x86 x86_64; do
          in="$OUT/app-$abi-release-unsigned.apk"
          aligned="$OUT/app-$abi-aligned.apk"
          out="$OUT/AkititoCraft-$abi.apk"
          "$BT/zipalign" -f -p 4 "$in" "$aligned"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass pass:akititocraft --key-pass pass:akititocraft \
            --out "$out" "$aligned"
          "$BT/apksigner" verify --verbose "$out"
        done
    - name: Save AAB artifact
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-release.aab
        path: android/app/build/outputs/bundle/release/app-release.aab
    - name: Save armeabi artifact
      uses: actions/upload-artifact@v7
      with:
        name: AkititoCraft-armeabi-v7a.apk
        path: android/app/build/outputs/apk/release/AkititoCraft-armeabi-v7a.apk
    - name: Save arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: AkititoCraft-arm64-v8a.apk
        path: android/app/build/outputs/apk/release/AkititoCraft-arm64-v8a.apk
    - name: Save x86 artifact
      uses: actions/upload-artifact@v7
      with:
        name: AkititoCraft-x86.apk
        path: android/app/build/outputs/apk/release/AkititoCraft-x86.apk
    - name: Save x86_64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: AkititoCraft-x86_64.apk
        path: android/app/build/outputs/apk/release/AkititoCraft-x86_64.apk
